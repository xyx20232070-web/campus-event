<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>users.title.tag</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="events.html" data-i18n="app.name"></a>
      <nav id="nav" class="nav"></nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title" data-i18n="users.title"></h1>
    <p class="page-sub" data-i18n="users.sub"></p>

    <!-- 录入新账号 -->
    <div class="card">
      <h3 style="margin-bottom:12px" data-i18n="users.addTitle"></h3>
      <form id="addUserForm">
        <div class="form-row">
          <div class="form-group">
            <label for="newUserId" data-i18n="users.id"></label>
            <input id="newUserId" data-i18n-ph="users.idPh" required maxlength="20">
          </div>
          <div class="form-group">
            <label for="newUserName" data-i18n="users.name"></label>
            <input id="newUserName" data-i18n-ph="users.namePh" required maxlength="20">
          </div>
          <div class="form-group">
            <label for="initPassword" data-i18n="users.initPwd"></label>
            <input id="initPassword" value="123456" required minlength="6" maxlength="20">
          </div>
          <div class="form-group">
            <label for="newUserPhone" data-i18n="users.phone"></label>
            <input id="newUserPhone" type="tel" data-i18n-ph="users.phonePh" required maxlength="20">
          </div>
          <div class="form-group">
            <label for="newUserRole" data-i18n="users.col.role"></label>
            <select id="newUserRole">
              <option value="student" data-i18n="role.student"></option>
              <option value="admin" data-i18n="role.admin"></option>
            </select>
          </div>
        </div>
        <p class="form-error" id="addUserError"></p>
        <p class="form-success" id="addUserSuccess"></p>
        <button type="submit" class="btn btn-primary" id="addUserBtn" data-i18n="users.submit"></button>
      </form>
    </div>

    <!-- 账号列表 -->
    <div class="card">
      <h3 style="margin-bottom:12px" data-i18n="users.listTitle"></h3>
      <div class="toolbar">
        <button class="btn btn-outline btn-sm" id="exportBtn" data-i18n="users.export"></button>
        <button class="btn btn-danger btn-sm" id="resetAllBtn" data-i18n="users.resetAll"></button>
      </div>
      <div class="loading" id="userLoading"></div>
      <div class="table-wrap" id="userTable"></div>
    </div>
  </main>

  <script type="module" src="js/users.js"></script>
</body>
</html>
