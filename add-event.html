<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>add.title.tag</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="events.html" data-i18n="app.name"></a>
      <nav id="nav" class="nav"></nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title" data-i18n="add.title"></h1>
    <p class="page-sub" data-i18n="add.sub"></p>

    <div class="card" style="max-width:640px">
      <form id="eventForm">
        <div class="form-group">
          <label for="name" data-i18n="add.name"></label>
          <input id="name" data-i18n-ph="add.namePh" required maxlength="50">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="date" data-i18n="add.date"></label>
            <input id="date" type="date" required>
          </div>
          <div class="form-group">
            <label for="time" data-i18n="add.time"></label>
            <input id="time" type="time" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="place" data-i18n="add.place"></label>
            <input id="place" data-i18n-ph="add.placePh" required maxlength="60">
          </div>
          <div class="form-group">
            <label for="maxPeople" data-i18n="add.maxPeople"></label>
            <input id="maxPeople" type="number" min="1" max="10000" required>
          </div>
        </div>
        <div class="form-group">
          <label for="description" data-i18n="add.desc"></label>
          <textarea id="description" rows="4" data-i18n-ph="add.descPh" maxlength="500"></textarea>
        </div>
        <p class="form-error" id="formError"></p>
        <p class="form-success" id="formSuccess"></p>
        <div class="actions">
          <button type="submit" class="btn btn-primary" id="submitBtn" data-i18n="add.submit"></button>
          <a class="btn btn-outline" href="events.html" data-i18n="action.back"></a>
        </div>
      </form>
    </div>
  </main>

  <script type="module" src="js/add-event.js"></script>
</body>
</html>
