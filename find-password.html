<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fpw.title.tag</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <!-- 中韩语言切换 -->
  <div class="login-lang">
    <div class="lang-switch on-light">
      <button type="button" data-lang-btn="zh">中</button>
      <button type="button" data-lang-btn="ko">한</button>
    </div>
  </div>

  <div class="login-card card">
    <h1 class="login-title" data-i18n="fpw.title"></h1>
    <p class="login-sub" data-i18n="fpw.sub"></p>

    <!-- 第 1 步：输入账号 -->
    <div id="step1">
      <div class="form-group">
        <label for="fpUserId" data-i18n="fpw.userId"></label>
        <input id="fpUserId" data-i18n-ph="login.userIdPh" autocomplete="username">
      </div>
      <p class="form-error" id="findError"></p>
      <button type="button" class="btn btn-primary btn-block" id="nextBtn" data-i18n="fpw.next"></button>
    </div>

    <!-- 第 2 步：按坐标输入口令卡数字 -->
    <div id="step2" style="display:none">
      <div class="coord-tip" id="coordTip"></div>
      <div class="form-group">
        <label for="coordInput" data-i18n="fpw.inputLabel"></label>
        <input id="coordInput" data-i18n-ph="fpw.coordPh" maxlength="3" inputmode="numeric">
      </div>
      <p class="form-error" id="coordError"></p>
      <p class="form-success" id="coordSuccess"></p>
      <button type="button" class="btn btn-primary btn-block" id="verifyBtn" data-i18n="fpw.submit"></button>
    </div>

    <p class="login-tip"><a href="index.html" data-i18n="fpw.goLogin"></a></p>
  </div>

  <script type="module" src="js/find-password.js"></script>
</body>
</html>
