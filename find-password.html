<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>fpd.title.tag</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <!-- 中韩语言切换 -->
  <div class="login-lang">
    <div class="lang-switch on-light">
      <button type="button" data-lang-btn="zh">中</button>
      <button type="button" data-lang-btn="ko">한</button>
    </div>
  </div>

  <div class="login-card card">
    <h1 class="login-title" data-i18n="fpd.title"></h1>
    <p class="login-sub" data-i18n="fpd.sub"></p>

    <form id="findForm">
      <div class="form-group">
        <label for="fpUserId" data-i18n="fpd.userId"></label>
        <input id="fpUserId" data-i18n-ph="login.userIdPh" autocomplete="username">
      </div>

      <p class="form-error" id="findError"></p>
      <p class="form-success" id="findSuccess"></p>
      <button type="submit" class="btn btn-primary btn-block" id="findBtn" data-i18n="fpd.verifyBtn"></button>
    </form>

    <p class="login-tip"><a href="index.html" data-i18n="fpd.goLogin"></a></p>
  </div>

  <script type="module" src="js/find-password.js"></script>
</body>
</html>
