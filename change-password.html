<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pwd.title.tag</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <!-- 中韩语言切换 -->
  <div class="login-lang">
    <div class="lang-switch on-light">
      <button type="button" data-lang-btn="zh">中</button>
      <button type="button" data-lang-btn="ko">한</button>
    </div>
  </div>

  <main style="max-width:480px;width:100%">
    <div class="card login-card" style="max-width:none">
      <h1 class="page-title" data-i18n="pwd.title"></h1>
      <p class="page-sub" id="pwdTip"></p>

      <form id="pwdForm">
        <div class="form-group">
          <label for="oldPassword" data-i18n="pwd.old"></label>
          <input id="oldPassword" type="password" data-i18n-ph="pwd.oldPh" required autocomplete="current-password">
        </div>
        <div class="form-group">
          <label for="newPassword" data-i18n="pwd.new"></label>
          <input id="newPassword" type="password" data-i18n-ph="pwd.newPh" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirmPassword" data-i18n="pwd.confirm"></label>
          <input id="confirmPassword" type="password" data-i18n-ph="pwd.confirmPh" required minlength="6" autocomplete="new-password">
        </div>
        <p class="form-error" id="pwdError"></p>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn" data-i18n="pwd.submit"></button>
      </form>

      <p class="login-tip" id="reloginTip"></p>
    </div>
  </main>

  <script type="module" src="js/change-password.js"></script>
</body>
</html>
